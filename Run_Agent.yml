name: Run Agent

job:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirments.txt

      - name: Run the Agent
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python agent.py
